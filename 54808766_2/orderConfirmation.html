<!DOCTYPE html>
<html lang="en">

<head>
    <!--
        Author: Zimkhitha Matshangaza
        Date: 14 June 2026
        Filename: orderConfirmation.html
    -->

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Order Confirmation | Slime's Braai & Mleqwa Delicious Food</title>

    <link rel="stylesheet" href="StyleSheet/registrationform.css">
    <link rel="stylesheet" href="StyleSheet/styles.css">

    <script src="js/populateOrderConfirmation.js" defer></script>
</head>

<body>

 <header class="header">
    <h1>Slime's Braai & Mleqwa Delicious Food</h1>
        <nav class="header-nav">
            <div class="header-nav-logo">
                <a href="index.html">
                    <img src="images/logo.png" alt="Slime's Braai & Mleqwa Delicious Food Logo" class="header-logo">
                </a>
            </div>
            <ul class="menu-items">
                <li class="menu-item"><a href="index.html">Home</a></li>
                <li class="menu-item"><a href="products.html">Products</a></li>
                <li class="menu-item"><a href="staff.html">Staff</a></li>
                <li class="menu-item"><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
  </header>

    <!-- Main Content -->

    <main>

        <div class="container">

            <h1>Confirm & Pay</h1>

            <form id="orderConfirmationForm">

                <!-- Personal Information -->
                <fieldset>
                    <legend>Personal Information</legend>
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="preferredName">Preferred Name</label>
                            <input type="text" id="preferredName" readonly>
                        </div>
                        <div class="form-group">
                            <label for="surname">Surname</label>
                            <input type="text" id="surname" readonly>
                        </div>
                        <div class="form-group">
                            <label for="idNumber">ID Number</label>
                            <input type="text" id="idNumber" readonly>
                        </div>
                        <div class="form-group">
                            <label for="cellPhone">Cell Phone Number</label>
                            <input type="text" id="cellPhone" readonly>
                        </div>
                        <div class="form-group">
                            <label for="email">Email Address</label>
                            <input type="email" id="email" readonly>
                        </div>
                    </div>
                </fieldset>
                 <!-- Payment Information -->

                <fieldset>

                    <legend>Payment Information</legend>
                    <div class="form-group">
                    <label for="cardName">Name on Credit Card</label>
                    <input type="text" id="cardName" readonly>
                    </div>
                    <div class="form-group">
                    <label for="cardType">Credit Card Type</label>
                    <input type="text" id="cardType" readonly>
                   </div>
                   <div class="form-group">
                    <label for="cardNumber">Credit Card Number</label>
                    <input type="text" id="cardNumber" readonly>
                    </div>
                    <div class="row">
                </fieldset>
                
                <!-- Order Summary -->

                <fieldset>
                    <legend>Order Summary</legend>

                    <table id="orderTable" class="order-table">
                        <thead>
                            <tr>
                                <th>Product Name</th>
                                <th>Price (R)</th>
                                <th>Quantity</th>
                                <th>Extra Cost (R)</th>
                                <th>Total (R)</th>
                            </tr>
                        </thead>

                        <tbody>
                            <!-- Products will be inserted here using JavaScript -->
                        </tbody>

                        <tfoot>
                            <tr>
                                <td colspan="4"><strong>Subtotal</strong></td>
                                <td id="subtotal"></td>
                            </tr>

                            <tr>
                                <td colspan="4"><strong>VAT (15%)</strong></td>
                                <td id="vat"></td>
                            </tr>

                            <tr>
                                <td colspan="4"><strong>Total Amount</strong></td>
                                <td id="grandTotal"></td>
                            </tr>
                        </tfoot>
                    </table>

                </fieldset>
             <div class="buttons bottom-btns">
                <button type="button" id="confirmOrder">
                    Confirm Order
                </button>
                <button type="button" id="clearOrder">
                    Clear Order
                </button>
                </div>
            </form>

        </div>

    </main>
</body>

</html>

  <main class="container">

    <div class="form-div">

      <h2>Client Registration Form</h2>

      <form id="registrationForm" novalidate>

        <!-- Personal Information -->
        <fieldset>
          <legend>Personal Information</legend>

          <div class="form-grid">

            <div class="form-group">
              <label for="preferredName">Preferred Name</label>
              <input type="text" id="preferredName" name="preferredName" required>
            </div>

            <div class="form-group">
              <label for="fullNames">Full Names as on ID</label>
              <input type="text" id="fullNames" name="fullNames" required>
            </div>

            <div class="form-group">
              <label for="surname">Surname</label>
              <input type="text" id="surname" name="surname" required>
            </div>

            <div class="form-group">
              <label for="idNumber">ID Number</label>
              <input type="text" id="idNumber" name="idNumber" required>
            </div>

            <div class="form-group">
              <label for="telephoneWork">Telephone Work</label>
              <input type="tel" id="telephoneWork" name="telephoneWork">
            </div>

            <div class="form-group">
              <label for="cellphoneNumber">Cellphone Number</label>
              <input type="tel" id="cellphoneNumber" name="cellphoneNumber" required>
            </div>

            <div class="form-group">
              <label for="email">E-mail</label>
              <input type="email" id="email" name="email" required>
            </div>

            <div class="form-group">
              <label for="homeAddress">Home Address</label>
              <input type="text" id="homeAddress" name="homeAddress" required>
            </div>

            <div class="form-group">
              <label for="postalAddress">Postal Address</label>
              <input type="text" id="postalAddress" name="postalAddress" required>
            </div>

          </div>
        </fieldset>

        <!-- How the client heard about the business -->
        <fieldset>
          <legend>How Did You Hear About Us?</legend>

          <div class="form-group">
            <label for="heardAboutUs">Please select an option</label>
            <select id="heardAboutUs" name="heardAboutUs" required>
              <option value="">Select an option</option>
              <option value="side-of-road">Saw us on the side of the road</option>
              <option value="word-of-mouth">Word of mouth</option>
              <option value="internet-search">Internet search</option>
              <option value="advertising">Advertising</option>
            </select>
          </div>
        </fieldset>

        <!-- Products and services -->
        <fieldset>
          <legend>Products / Services of Interest</legend>

          <div class="checkbox-group">

            <label>
              <input type="checkbox" name="interest" value="braai">
              Braai
            </label>

            <label>
              <input type="checkbox" name="interest" value="mleqwa">
              Mleqwa
            </label>

            <label>
              <input type="checkbox" name="interest" value="food">
              Delicious Food
            </label>

          </div>
        </fieldset>

        <!-- Payment Information -->
        <fieldset>
          <legend>Payment Information</legend>

          <div class="form-grid">

            <div class="form-group">
              <label for="cardName">Name on Credit Card</label>
              <input type="text" id="cardName" name="cardName" required>
            </div>

            <div class="form-group">
              <label for="cardType">Credit Card Type</label>
              <select id="cardType" name="cardType" required>
                <option value="">Select card type</option>
                <option value="visa">Visa</option>
                <option value="mastercard">Mastercard</option>
                <option value="amex">American Express</option>
              </select>
            </div>

            <div class="form-group">
              <label for="cardNumber">Credit Card Number</label>
              <input type="text" id="cardNumber" name="cardNumber" required>
            </div>

            <div class="form-group">
              <label for="expirationMonth">Expiration Month</label>
              <select id="expirationMonth" name="expirationMonth" required>
                <option value="">Select month</option>
                <option value="01">January</option>
                <option value="02">February</option>
                <option value="03">March</option>
                <option value="04">April</option>
                <option value="05">May</option>
                <option value="06">June</option>
                <option value="07">July</option>
                <option value="08">August</option>
                <option value="09">September</option>
                <option value="10">October</option>
                <option value="11">November</option>
                <option value="12">December</option>
              </select>
            </div>

            <div class="form-group">
              <label for="expirationYear">Expiration Year</label>
              <select id="expirationYear" name="expirationYear" required>
                <option value="">Select year</option>
                <option value="2024">2024</option>
                <option value="2025">2025</option>
                <option value="2026">2026</option>
                <option value="2027">2027</option>
                <option value="2028">2028</option>
                <option value="2029">2029</option>
              </select>
            </div>

            <div class="form-group">
              <label for="cvc">CVC</label>
              <input type="text" id="cvc" name="cvc" required>
            </div>

          </div>
        </fieldset>

        <!-- Postal address copy -->
        <fieldset>
          <legend>Postal Address</legend>

          <div class="copy-row">
            <input type="checkbox" id="copyPostalAddress" name="copyPostalAddress">
            <label for="copyPostalAddress">
              Copy home address to postal address
            </label>
          </div>
        </fieldset>

        <!-- Account Information -->
        <fieldset>
          <legend>Username &amp; Password</legend>

          <div class="form-grid">

            <div class="form-group">
              <label for="username">Username</label>
              <input type="text" id="username" name="username" required>
            </div>

            <div class="form-group">
              <label for="accountPassword">Password</label>
              <input type="password" id="accountPassword" name="accountPassword" required>
            </div>

            <div class="form-group">
              <label for="confirmAccountPassword">Password Confirmation</label>
              <input type="password" id="confirmAccountPassword" name="confirmAccountPassword" required>
            </div>

          </div>
        </fieldset>

        <!-- Additional Information -->
        <fieldset>
          <legend>Additional Information</legend>

          <div class="form-group">
            <label for="additionalInformation">Additional Information</label>
            <textarea id="additionalInformation" name="additionalInformation" rows="5"></textarea>
          </div>

          <div class="form-group">
            <label for="questions">Questions</label>
            <textarea id="questions" name="questions" rows="5"></textarea>
          </div>

        </fieldset>

        <!-- Submit -->
        <div class="form-grid">

          <button type="submit" id="subButton" class="btn">
            Submit Registration
          </button>

        </div>

      </form>

    </div>

  </main>
</body>
